spring.application.name=ferreteria-copacabana
server.port=8080

# Base de datos H2 en archivo (no hay que instalar nada). Se crea en ./data
spring.datasource.url=jdbc:h2:file:./data/ferreteria
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

